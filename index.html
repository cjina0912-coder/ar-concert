function youtubeId(url){try{const u=new URL(String(url||''));const h=u.hostname.toLowerCase();let v='';if(h==='youtu.be'||h==='www.youtu.be')v=u.pathname.slice(1).split('/')[0];else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','www.youtube-nocookie.com'].includes(h)){v=u.searchParams.get('v')||'';if(!v){const m=u.pathname.match(/^\/(?:shorts|embed|live)\/([^/]+)/);if(m)v=m[1]}}return /^[A-Za-z0-9_-]{11}$/.test(v)?v:''}catch(e){return ''}}

function resizeStage(f){modelScale=Math.max(.008,Math.min(.12,modelScale*f));stage.scale.setScalar(modelScale)}
document.querySelector('#smaller').onclick=()=>resizeStage(.8);document.querySelector('#bigger').onclick=()=>resizeStage(1.25);document.querySelector('#left').onclick=()=>stage.rotation.y-=.2;document.querySelector('#right').onclick=()=>stage.rotation.y+=.2;document.querySelector('#reset').onclick=placeFallback;
let xrButton=null;document.querySelector('#startXR').onclick=()=>{if(xrButton){xrButton.click();return}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;video.style.display='none'}mode='xr';camera.position.set(0,0,0);stage.visible=false;hint.textContent='태블릿으로 바닥을 비추세요. 초록색 원이 보이면 화면을 터치해 무대를 배치하세요.';xrButton=ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});xrButton.id='arButton';document.body.appendChild(xrButton);xrButton.click()};
const controller=renderer.xr.getController(0);controller.addEventListener('select',()=>{if(mode!=='xr'||!reticle.visible)return;reticle.matrix.decompose(stage.position,stage.quaternion,new THREE.Vector3());stage.visible=true;hint.textContent='AR 무대가 배치되었습니다. 태블릿을 움직여 감상하세요.'});scene.add(controller);
renderer.xr.addEventListener('sessionend',()=>{mode='';hitSource=null;hitRequested=false;hitReady=false;reticle.visible=false;stage.visible=false;hint.textContent='실제 AR이 종료되었습니다. 다시 시작하거나 카메라 합성 모드를 선택하세요.'});
renderer.setAnimationLoop((t,frame)=>{if(musicPlaying){const tm=t*.003;performers.forEach(p=>{const a=Math.sin(tm*2+p.phase);p.leftArm.rotation.z=.25+a*.38;p.rightArm.rotation.z=-.25-a*.38})}else performers.forEach(p=>{p.leftArm.rotation.z=0;p.rightArm.rotation.z=0});if(mode==='xr'&&frame){const session=renderer.xr.getSession();if(session&&!hitRequested){hitRequested=true;session.requestReferenceSpace('viewer').then(space=>session.requestHitTestSource({space})).then(src=>{hitSource=src}).catch(()=>{hint.textContent='바닥 인식 기능을 시작하지 못했습니다.'})}if(hitSource){const hits=frame.getHitTestResults(hitSource);if(hits.length){const pose=hits[0].getPose(renderer.xr.getReferenceSpace());if(pose){reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix)}}else reticle.visible=false}}renderer.render(scene,camera)});
init();
</script></body></html>
